name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch
      update_downstreams:
        description: Update downstream repositories after publishing
        required: true
        default: true
        type: boolean
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Calculate version
        id: version
        uses: Kralizek/github-actions/actions/calculate-next-version@v0.3
        with:
          bump: ${{ inputs.bump }}

      - name: Set package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deno eval --allow-read --allow-write --allow-env '
            const version = Deno.env.get("VERSION")!;
            const root = JSON.parse(await Deno.readTextFile("deno.json"));

            for (const member of root.workspace) {
              const file = `${member}/deno.json`;
              const config = JSON.parse(await Deno.readTextFile(file));
              config.version = version;
              await Deno.writeTextFile(file, `${JSON.stringify(config, null, 2)}\n`);
            }
          '

      - name: Create release commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Package versions already match $TAG; tagging current commit."
            exit 0
          fi

          mapfile -t manifests < <(jq -r '.workspace[] + "/deno.json"' deno.json)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${manifests[@]}"
          git commit -m "Release $TAG"

      - name: Validate
        run: |
          deno task check
          deno publish --dry-run

      - name: Create immutable version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

          git tag "$TAG" HEAD
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs['previous-tag'] }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            --verify-tag
            --generate-notes
            --title "$TAG"
          )

          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "${args[@]}"

  publish:
    needs: create-release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && needs.create-release.result == 'success') ||
       (github.event_name == 'release' && github.event.action == 'published'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ needs.create-release.outputs.tag }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$PUBLISHED_TAG"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Validate release tag
        id: version
        uses: Kralizek/github-actions/actions/validate-release@v0.3
        with:
          tag: ${{ steps.release.outputs.tag }}
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease }}

      - name: Validate package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r manifest; do
            actual="$(jq -r .version "$manifest")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "$manifest has version $actual, expected $VERSION" >&2
              exit 1
            fi
          done < <(jq -r '.workspace[] + "/deno.json"' deno.json)

      - name: Check
        run: deno task check

      - name: Validate packages
        run: deno publish --dry-run

      - name: Pack release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_DIR: ${{ runner.temp }}/hooksmith-dist
        run: |
          set -euo pipefail
          mkdir -p "$ASSET_DIR"

          while IFS= read -r member; do
            name="$(jq -r .name "$member/deno.json")"
            asset_name="${name#@hooksmith/}"

            (
              cd "$member"
              deno pack --output "$ASSET_DIR/hooksmith-${asset_name}-${VERSION}.tgz"
            )
          done < <(jq -r '.workspace[]' deno.json)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_DIR: ${{ runner.temp }}/hooksmith-dist
        run: gh release upload "$TAG" "$ASSET_DIR"/*.tgz --clobber

      - name: Publish packages
        run: deno publish

  update-downstreams:
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.update_downstreams)
    uses: ./.github/workflows/update-downstreams.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets:
      HOOKSMITH_DOWNSTREAM_TOKEN: ${{ secrets.HOOKSMITH_DOWNSTREAM_TOKEN }}
