name: Create release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          if [[ -z "$latest_tag" ]]; then
            version="0.1.0"
          else
            current="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$current"

            case "${{ inputs.bump }}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
            esac

            version="${major}.${minor}.${patch}"
          fi

          IFS='.' read -r major minor patch <<< "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "major_tag=v$major" >> "$GITHUB_OUTPUT"
          echo "minor_tag=v$major.$minor" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Update package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deno eval --allow-read --allow-write --allow-env '
            const version = Deno.env.get("VERSION")!;
            const files = [
              "packages/core/deno.json",
              "packages/runtime/deno.json",
              "packages/cli/deno.json",
            ];

            for (const file of files) {
              const config = JSON.parse(await Deno.readTextFile(file));
              config.version = version;
              await Deno.writeTextFile(file, `${JSON.stringify(config, null, 2)}\n`);
            }
          '

      - name: Validate
        run: |
          deno task check
          deno publish --dry-run

      - name: Pack release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          (
            cd packages/core
            deno pack --output "../../dist/hooksmith-core-${VERSION}.tgz"
          )

          (
            cd packages/runtime
            deno pack --output "../../dist/hooksmith-runtime-${VERSION}.tgz"
          )

          (
            cd packages/cli
            deno pack --output "../../dist/hooksmith-cli-${VERSION}.tgz"
          )

      - name: Create release commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Package versions already match $TAG; tagging current commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/deno.json packages/runtime/deno.json packages/cli/deno.json
          git commit -m "Release $TAG"

      - name: Create immutable version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >-
          gh release create "$TAG"
          --verify-tag
          --generate-notes
          --title "$TAG"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" dist/*.tgz

      - name: Move action version tags
        env:
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
          MINOR_TAG: ${{ steps.version.outputs.minor_tag }}
        run: |
          set -euo pipefail

          git tag --force "$MAJOR_TAG"
          git tag --force "$MINOR_TAG"
          git push --force origin "$MAJOR_TAG" "$MINOR_TAG"
