name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Format
        run: deno fmt

      - name: Capture formatting diff
        shell: bash
        run: git diff > formatting.patch

      - uses: actions/upload-artifact@v4
        with:
          name: formatting-diff
          path: formatting.patch

      - name: Lint
        run: deno lint

      - name: Check docs
        run: deno task check:docs

      - name: Test
        run: deno test -A

      - name: Validate packages
        run: deno publish --dry-run

  discover-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.discover.outputs.examples }}

    steps:
      - uses: actions/checkout@v7

      - name: Discover isolated examples
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          examples=$(find examples -type f -name deno.json -printf '%h\n' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

  examples:
    needs: discover-examples
    strategy:
      matrix:
        example: ${{ fromJSON(needs.discover-examples.outputs.examples) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Check ${{ matrix.example }}
        working-directory: ${{ matrix.example }}
        run: deno task check
