name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Check
        run: deno task check

      - name: Validate packages
        run: deno publish --dry-run

      - name: Validate unpublished remote extension
        shell: bash
        run: |
          set -euo pipefail

          deno run -A ./packages/cli/mod.ts \
            run ./examples/remote-extension/event.yaml \
            --config ./examples/remote-extension/hooksmith.config.ts \
            --format json > /tmp/hooksmith-remote-extension-report.json

          jq -e '
            .success == true and
            .results == [{
              "route": "external-extension",
              "listener": "external-log",
              "status": "success",
              "message": "Handled by hooksmith-test-extension",
              "data": {
                "extension": "Kralizek/hooksmith-test-extension"
              }
            }]
          ' /tmp/hooksmith-remote-extension-report.json

  action:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Hooksmith through the action
        id: hooksmith
        uses: ./
        with:
          event: ./examples/basic/event.yaml
          config: ./examples/basic/hooksmith.config.ts

      - name: Validate action outputs and report file
        env:
          HOOKSMITH_SUCCESS: ${{ steps.hooksmith.outputs.success }}
          HOOKSMITH_MODE: ${{ steps.hooksmith.outputs.mode }}
          HOOKSMITH_REPORT_PATH: ${{ steps.hooksmith.outputs.report-path }}
        run: |
          test "$HOOKSMITH_SUCCESS" = "true"
          test "$HOOKSMITH_MODE" = "run"
          test "$HOOKSMITH_REPORT_PATH" = "$GITHUB_WORKSPACE/.hooksmith/report.json"
          test -f "$HOOKSMITH_REPORT_PATH"

          jq -e '
            .success == true and
            .mode == "run" and
            .event.type == "page.published" and
            .results == [{
              "route": "published-pages",
              "listener": "log-event",
              "status": "success",
              "message": "Logged page.published"
            }]
          ' "$HOOKSMITH_REPORT_PATH"
