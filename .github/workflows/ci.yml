name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Check
        run: deno task check

      - name: Validate stream mode
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n%s\n' \
            '{"type":"page.published","timestamp":"2026-08-31T20:00:00Z","source":{"kind":"website","id":"example.com"},"subject":{"kind":"page","id":"/hello"},"data":{"title":"Hello"}}' \
            '{"type":42}' \
            | deno run -A ./packages/cli/mod.ts stream \
                --config ./examples/basic/hooksmith.config.ts \
            > /tmp/hooksmith-stream.ndjson

          jq -s -e '
            length == 2 and
            .[0].success == true and
            .[0].events[0].event.type == "page.published" and
            .[1].success == false and
            .[1].events[0].outcome == "rejected"
          ' /tmp/hooksmith-stream.ndjson

      - name: Validate packages
        run: deno publish --dry-run

  discover-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.discover.outputs.examples }}

    steps:
      - uses: actions/checkout@v7

      - name: Discover isolated examples
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          examples=$(find examples -type f -name deno.json -printf '%h\n' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

  examples:
    needs: discover-examples
    strategy:
      matrix:
        example: ${{ fromJSON(needs.discover-examples.outputs.examples) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Check ${{ matrix.example }}
        working-directory: ${{ matrix.example }}
        run: deno task check

  action:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Run Hooksmith through the action
        id: hooksmith
        uses: ./
        with:
          event: ./examples/basic/event.yaml
          config: ./examples/basic/hooksmith.config.ts

      - name: Validate action outputs and report file
        shell: bash
        env:
          HOOKSMITH_SUCCESS: ${{ steps.hooksmith.outputs.success }}
          HOOKSMITH_MODE: ${{ steps.hooksmith.outputs.mode }}
          HOOKSMITH_REPORT_PATH: ${{ steps.hooksmith.outputs.report-path }}
        run: |
          test "$HOOKSMITH_SUCCESS" = "true"
          test "$HOOKSMITH_MODE" = "run"
          test -f "$HOOKSMITH_REPORT_PATH"

          jq -e '
            .success == true and
            .mode == "run" and
            (.events | length) == 1 and
            .events[0].event.type == "page.published" and
            .events[0].results == [{
              "route": "published-pages",
              "listener": "log-event",
              "status": "success",
              "message": "Logged page.published"
            }]
          ' "$HOOKSMITH_REPORT_PATH"

      - name: Plan Hooksmith with custom report path
        id: hooksmith-plan
        uses: ./
        with:
          event: ./examples/basic/event.yaml
          config: ./examples/basic/hooksmith.config.ts
          plan: true
          report-path: ${{ runner.temp }}/hooksmith/custom-plan-report.json

      - name: Validate plan outputs and custom report path
        shell: bash
        env:
          HOOKSMITH_SUCCESS: ${{ steps.hooksmith-plan.outputs.success }}
          HOOKSMITH_MODE: ${{ steps.hooksmith-plan.outputs.mode }}
          HOOKSMITH_REPORT_PATH: ${{ steps.hooksmith-plan.outputs.report-path }}
        run: |
          test "$HOOKSMITH_SUCCESS" = "true"
          test "$HOOKSMITH_MODE" = "plan"
          test -f "$HOOKSMITH_REPORT_PATH"
          jq -e '.success == true and .mode == "plan"' "$HOOKSMITH_REPORT_PATH"

      - name: Run Hooksmith with invalid input
        id: failed-hooksmith
        continue-on-error: true
        uses: ./
        with:
          event: ./examples/basic/does-not-exist.yaml
          config: ./examples/basic/hooksmith.config.ts

      - name: Validate failure outputs
        if: always()
        shell: bash
        env:
          HOOKSMITH_OUTCOME: ${{ steps.failed-hooksmith.outcome }}
          HOOKSMITH_SUCCESS: ${{ steps.failed-hooksmith.outputs.success }}
          HOOKSMITH_MODE: ${{ steps.failed-hooksmith.outputs.mode }}
          HOOKSMITH_REPORT_PATH: ${{ steps.failed-hooksmith.outputs.report-path }}
        run: |
          test "$HOOKSMITH_OUTCOME" = "failure"
          test "$HOOKSMITH_SUCCESS" = "false"
          test "$HOOKSMITH_MODE" = "run"
          test -n "$HOOKSMITH_REPORT_PATH"
