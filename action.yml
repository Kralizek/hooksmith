name: Hooksmith
description: Run a Hooksmith event using the CLI version that matches this action release.
author: Renato Golia

inputs:
  event:
    description: Path to the YAML or JSON event document, relative to the workspace.
    required: true
  config:
    description: Path to the Hooksmith configuration module, relative to the workspace.
    required: false
    default: hooksmith.config.ts
  plan:
    description: Evaluate routing without invoking listeners.
    required: false
    default: "false"

outputs:
  report:
    description: Hooksmith run report as JSON.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
        cache: true

    - name: Run Hooksmith
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        HOOKSMITH_EVENT: ${{ inputs.event }}
        HOOKSMITH_CONFIG: ${{ inputs.config }}
        HOOKSMITH_PLAN: ${{ inputs.plan }}
      run: |
        set -euo pipefail

        version="$(
          deno eval --allow-read \
            'const manifest = JSON.parse(await Deno.readTextFile(Deno.args[0])); console.log(manifest.version);' \
            "$GITHUB_ACTION_PATH/packages/cli/deno.json"
        )"

        args=(
          run "$HOOKSMITH_EVENT"
          --config "$HOOKSMITH_CONFIG"
          --format json
        )

        case "$HOOKSMITH_PLAN" in
          true)
            args+=(--plan)
            ;;
          false)
            ;;
          *)
            echo "::error::plan must be either 'true' or 'false'."
            exit 1
            ;;
        esac

        set +e
        report="$(deno run -A "jsr:@hooksmith/cli@${version}" "${args[@]}")"
        status=$?
        set -e

        delimiter="HOOKSMITH_REPORT_$(date +%s%N)"
        {
          echo "report<<${delimiter}"
          echo "$report"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

        echo "$report"
        exit "$status"

branding:
  icon: tool
  color: gray-dark
