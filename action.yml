name: Hooksmith
description: Run a Hooksmith event using the CLI version that matches this action release.
author: Renato Golia

inputs:
  event:
    description: Path to the YAML or JSON event document, relative to the workspace.
    required: true
  config:
    description: Path to the Hooksmith configuration module, relative to the workspace.
    required: false
    default: hooksmith.config.ts
  plan:
    description: Evaluate routing without invoking listeners.
    required: false
    default: "false"
  report-path:
    description: Optional path where the JSON run report is written, relative to the workspace unless absolute.
    required: false

outputs:
  success:
    description: Whether the Hooksmith run succeeded.
    value: ${{ steps.run.outputs.success }}
  mode:
    description: Hooksmith execution mode (run or plan).
    value: ${{ steps.run.outputs.mode }}
  report-path:
    description: Absolute path to the JSON run report.
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
        cache: true

    - name: Run Hooksmith
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        HOOKSMITH_EVENT: ${{ inputs.event }}
        HOOKSMITH_CONFIG: ${{ inputs.config }}
        HOOKSMITH_PLAN: ${{ inputs.plan }}
        HOOKSMITH_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -euo pipefail

        version="$(
          deno eval --allow-read \
            'const manifest = JSON.parse(await Deno.readTextFile(Deno.args[0])); console.log(manifest.version);' \
            "$GITHUB_ACTION_PATH/packages/cli/deno.json"
        )"

        args=(
          run "$HOOKSMITH_EVENT"
          --config "$HOOKSMITH_CONFIG"
          --format json
        )

        case "$HOOKSMITH_PLAN" in
          true)
            args+=(--plan)
            ;;
          false)
            ;;
          *)
            echo "::error::plan must be either 'true' or 'false'."
            exit 1
            ;;
        esac

        if [[ -z "$HOOKSMITH_REPORT_PATH" ]]; then
          report_path="$RUNNER_TEMP/hooksmith/report.json"
        elif [[ "$HOOKSMITH_REPORT_PATH" = /* ]]; then
          report_path="$HOOKSMITH_REPORT_PATH"
        else
          report_path="$GITHUB_WORKSPACE/$HOOKSMITH_REPORT_PATH"
        fi

        mkdir -p "$(dirname "$report_path")"

        set +e
        deno run -A "jsr:@hooksmith/cli@${version}" "${args[@]}" > "$report_path"
        status=$?
        set -e

        echo "report-path=$report_path" >> "$GITHUB_OUTPUT"

        if [[ -s "$report_path" ]]; then
          values="$(
            deno eval --allow-read \
              'const report = JSON.parse(await Deno.readTextFile(Deno.args[0])); console.log(`${report.success}\t${report.mode}`);' \
              "$report_path"
          )"
          IFS=$'\t' read -r success mode <<< "$values"
          echo "success=$success" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
        fi

        exit "$status"

branding:
  icon: tool
  color: gray-dark
